<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SFNE — منصة لياقة وتغذية ذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1220;--surface:#111e30;--surface-2:#15263d;--border:#26384f;--mint:#57e3a0;--blue:#4c7cff;--coral:#ff6a4d;--text:#f3f6fb;--muted:#93a4bd;--shadow:0 22px 55px rgba(0,0,0,.28)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-width:0;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Tajawal,Cairo,sans-serif}
html[lang="en"] body{font-family:Arial,sans-serif}
img,svg{max-width:100%}
.app-root{width:100%;min-height:100vh;min-height:100dvh;overflow-x:clip;background:radial-gradient(circle at 90% 3%,rgba(76,124,255,.19),transparent 30rem),radial-gradient(circle at 7% 50%,rgba(87,227,160,.09),transparent 34rem),var(--bg)}
main{min-width:0}
main [class*="grid"]>*{min-width:0}
.heading{font-family:Cairo,Tajawal,sans-serif}
html[lang="en"] .heading{font-family:Georgia,serif;letter-spacing:-.03em}
.section-shell{width:100%;max-width:1180px;margin-inline:auto;padding-inline:16px}
@media(min-width:680px){.section-shell{padding-inline:20px}}
section{scroll-margin-top:92px}
.panel{background:rgba(17,30,48,.88);border:1px solid var(--border);border-radius:16px}
.focus-ring:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.nav-link{min-height:44px;display:inline-flex;align-items:center;padding:0 10px;border-radius:10px;color:var(--muted);font-weight:700;font-size:.9rem;white-space:nowrap;transition:.2s;text-decoration:none}
.nav-link:hover,.nav-link.active{background:#163427;color:var(--mint)}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1rem;border-radius:12px;border:1px solid transparent;font-weight:800;transition:transform .2s,filter .2s,background .2s;text-decoration:none;text-align:center;cursor:pointer}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-primary{background:var(--mint);color:#062419}.btn-outline{background:transparent;border-color:var(--border);color:var(--text)}
.eyebrow{display:inline-flex;align-items:center;gap:.45rem;border:1px solid #317854;background:#103525;color:#a4f4c9;border-radius:999px;padding:.38rem .7rem;font-size:.79rem;font-weight:800}
.section-title{font-size:clamp(1.6rem,4vw,2.8rem);line-height:1.2;font-weight:800}
.section-copy{margin-top:14px;max-width:700px;color:var(--muted);line-height:1.9}
.card{border:1px solid var(--border);background:rgba(17,30,48,.92);border-radius:16px;padding:20px;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:#42607f}
.icon-box{display:grid;place-items:center;width:46px;height:46px;border-radius:13px}
.ecg{height:40px;width:100%;opacity:.72;background:linear-gradient(90deg,transparent 0 3%,var(--mint) 3% 6%,transparent 6% 11%,var(--mint) 11% 14%,transparent 14% 100%);clip-path:polygon(0 50%,7% 50%,9% 50%,11% 8%,13% 91%,15% 50%,23% 50%,25% 33%,27% 68%,29% 50%,100% 50%)}
.mock-phone{position:relative;width:min(100%,310px);margin-inline:auto;border:7px solid #26384f;border-radius:34px;padding:14px;background:#0c1727;box-shadow:var(--shadow)}
.mock-phone:before{content:"";display:block;width:84px;height:17px;border-radius:0 0 12px 12px;background:#26384f;margin:-14px auto 12px}
.ring{width:120px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mint) 0 72%,#26384f 72% 100%)}
.ring>div{width:91px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--surface);text-align:center}
.pulse-line{height:54px;width:100%;overflow:visible}
.pulse-line polyline{stroke:var(--mint);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.counter{border-inline-start:1px solid var(--border);padding:0 6px}
.counter:first-child{border:0}
.tab-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.role-tab{min-height:44px;white-space:nowrap;border:1px solid var(--border);border-radius:11px;background:#101c2d;color:var(--muted);padding:.6rem .9rem;font-weight:800;cursor:pointer;font-family:inherit}
.role-tab[aria-selected="true"]{background:#103525;border-color:#317854;color:#a4f4c9}
.chip{min-height:44px;border:1px solid var(--border);border-radius:999px;background:#101c2d;color:var(--muted);padding:.55rem .85rem;font-weight:700;cursor:pointer;font-family:inherit}
.chip.selected{background:#18284d;border-color:var(--blue);color:#dbe5ff}
/* Drawer: in RTL the inline-end edge is the LEFT side, so hide toward the left; reverse in LTR */
.drawer{transform:translateX(-110%);visibility:hidden;transition:transform .25s ease,visibility .25s}
[dir="ltr"] .drawer{transform:translateX(110%)}
.drawer.open{transform:none;visibility:visible}
.overlay{opacity:0;visibility:hidden;transition:.2s}.overlay.open{opacity:1;visibility:visible}
.toast{transform:translateY(150%);opacity:0;transition:.25s;max-width:min(24rem,calc(100vw - 36px))}.toast.show{transform:none;opacity:1}
.loading-dot{width:9px;height:9px;border-radius:50%;background:var(--mint);animation:bounce .85s infinite alternate}
.loading-dot:nth-child(2){animation-delay:.15s}.loading-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{to{transform:translateY(-8px);opacity:.45}}
.reveal{animation:reveal .55s both}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.back-top{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:46px;height:46px;border:1px solid #317854;border-radius:14px;background:#103525;color:#a4f4c9;box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
[dir="ltr"] .flip-rtl{transform:scaleX(-1)}
@media(max-width:1023px){.desktop-nav,.desktop-actions{display:none!important}.hero-grid{grid-template-columns:1fr!important}}
@media(min-width:1024px){.menu-button,.drawer,.overlay{display:none!important}}
@media(max-width:479px){.counter strong{font-size:1.35rem!important}.counter span{font-size:.7rem!important}.btn{width:100%}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.card,.drawer,.overlay,.toast{transition:none}.loading-dot,.reveal{animation:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body>
<div class="app-root">
 <div class="bg-[#103525] px-3 py-1 text-center text-xs font-bold text-[#a4f4c9]">SFNE Landing — Mock preview</div>
 <header class="sticky top-0 z-40 border-b border-[#26384f] bg-[#0a1220]/90 backdrop-blur-xl" style="padding-top:env(safe-area-inset-top,0px)">
  <nav class="section-shell flex min-h-[68px] items-center justify-between gap-3" aria-label="التنقل الرئيسي">
   <a href="#hero" class="focus-ring flex items-center gap-2 rounded-xl font-bold no-underline text-white" aria-label="SFNE">
    <span class="grid h-10 w-10 place-items-center rounded-xl bg-[#57e3a0] text-lg font-black text-[#062419]">S</span><span class="heading text-xl">SFNE</span></a>
   <div id="desktop-nav" class="desktop-nav flex items-center gap-1"></div>
   <div class="desktop-actions flex items-center gap-2">
    <button id="language-toggle" class="btn btn-outline focus-ring px-3" type="button" aria-label="Language">EN</button>
    <a class="btn btn-outline focus-ring route-link" href="/login" data-route="/login"></a>
    <a class="btn btn-primary focus-ring route-link" href="/register" data-route="/register"></a>
   </div>
   <button id="menu-button" class="menu-button btn btn-outline focus-ring px-3" style="width:auto" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobile-drawer"><i data-lucide="menu"></i></button>
  </nav>
 </header>
 <div id="drawer-overlay" class="overlay fixed inset-0 z-40 bg-[#050b14]/80"></div>
 <aside id="mobile-drawer" class="drawer fixed bottom-0 top-0 z-50 w-[min(86vw,340px)] overflow-y-auto border-s border-[#26384f] bg-[#0d1929] p-5 shadow-2xl" style="inset-inline-end:0" aria-label="Menu">
  <div class="flex items-center justify-between"><strong class="heading text-2xl">SFNE</strong>
   <button id="drawer-close" class="btn btn-outline focus-ring px-3" style="width:auto" type="button" aria-label="Close"><i data-lucide="x"></i></button></div>
  <nav id="mobile-nav" class="mt-8 flex flex-col gap-2"></nav>
  <div class="mt-7 grid gap-2 border-t border-[#26384f] pt-5">
   <button id="mobile-language" class="btn btn-outline focus-ring" type="button">English</button>
   <a class="btn btn-outline focus-ring route-link" href="/login" data-route="/login"></a>
   <a class="btn btn-primary focus-ring route-link" href="/register" data-route="/register"></a>
  </div>
 </aside>

 <main>
  <section id="hero" class="section-shell py-14 sm:py-24">
   <div class="hero-grid grid items-center gap-10 lg:grid-cols-[1.08fr_.92fr] lg:gap-12">
    <div class="reveal">
     <span class="eyebrow"><i data-lucide="sparkles" width="16"></i><span data-i18n="heroBadge"></span></span>
     <h1 class="heading mt-5 max-w-3xl text-3xl font-extrabold leading-[1.25] sm:text-5xl lg:text-6xl" data-i18n="heroTitle"></h1>
     <p class="mt-5 max-w-2xl text-base leading-8 text-[#b8c5d8] sm:text-lg sm:leading-9" data-i18n="heroCopy"></p>
     <div class="mt-8 flex flex-wrap gap-3">
      <a href="#demo" class="btn btn-primary focus-ring"><i data-lucide="sparkles" width="18"></i><span data-i18n="heroPrimary"></span></a>
      <a href="#solution" class="btn btn-outline focus-ring"><span data-i18n="heroSecondary"></span><i data-lucide="arrow-left" width="18" class="flip-rtl"></i></a>
     </div>
     <div class="mt-10 grid max-w-xl grid-cols-3 rounded-2xl border border-[#26384f] bg-[#101c2d]/80 px-2 py-5">
      <div class="counter text-center"><strong class="heading block text-2xl text-[#81f2bd]" data-count="12">0</strong><span class="mt-1 block text-xs text-[#93a4bd]" data-i18n="counterFeatures"></span></div>
      <div class="counter text-center"><strong class="heading block text-2xl text-[#b9cbff]" data-count="8">0</strong><span class="mt-1 block text-xs text-[#93a4bd]" data-i18n="counterAi"></span></div>
      <div class="counter text-center"><strong class="heading block text-2xl text-[#ffad9c]" data-count="5">0</strong><span class="mt-1 block text-xs text-[#93a4bd]" data-i18n="counterRoles"></span></div>
     </div>
    </div>
    <div class="reveal" style="animation-delay:.15s">
     <div class="mock-phone" aria-hidden="true">
      <div class="flex items-center justify-between text-xs text-[#93a4bd]"><span>SFNE</span><i data-lucide="bell" width="15"></i></div>
      <div class="mt-5 rounded-2xl border border-[#26384f] bg-[#111e30] p-4">
       <div class="flex items-center justify-between"><span class="text-sm text-[#93a4bd]" data-i18n="mockCommitment"></span><span class="text-sm font-bold text-[#81f2bd]">72%</span></div>
       <div class="ring mx-auto mt-4"><div><strong class="text-xl">72%</strong><span class="block text-[10px] text-[#93a4bd]" data-i18n="mockWeek"></span></div></div>
      </div>
      <div class="mt-4 rounded-2xl border border-[#26384f] bg-[#111e30] p-4">
       <div class="flex items-center justify-between"><strong class="text-sm" data-i18n="mockProgress"></strong><i data-lucide="trending-up" width="17" class="text-[#57e3a0]"></i></div>
       <svg class="pulse-line mt-3" viewBox="0 0 280 54"><polyline points="0,42 33,37 70,40 108,24 145,31 184,15 220,22 280,5"></polyline></svg>
      </div>
      <div class="mt-4 flex items-center gap-2 rounded-xl border border-[#317854] bg-[#103525] px-3 py-3 text-sm font-bold text-[#b8f7d4]"><i data-lucide="sparkles" width="17"></i><span data-i18n="mockReady"></span></div>
     </div>
    </div>
   </div>
  </section>
  <div class="section-shell"><div class="ecg" aria-hidden="true"></div></div>

  <section id="problem" class="section-shell py-14 sm:py-20">
   <span class="eyebrow" style="border-color:#a34f40;background:#42201e;color:#ffc3b7"><i data-lucide="triangle-alert" width="16"></i><span data-i18n="problemEyebrow"></span></span>
   <h2 class="heading section-title mt-5" data-i18n="problemTitle"></h2>
   <p class="section-copy" data-i18n="problemCopy"></p>
   <div id="problem-grid" class="mt-9 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
  </section>
  <div class="section-shell"><div class="ecg" aria-hidden="true"></div></div>

  <section id="solution" class="section-shell py-14 sm:py-20">
   <span class="eyebrow"><i data-lucide="circle-check" width="16"></i><span data-i18n="solutionEyebrow"></span></span>
   <h2 class="heading section-title mt-5" data-i18n="solutionTitle"></h2>
   <p class="section-copy" data-i18n="solutionCopy"></p>
   <div id="solution-grid" class="mt-9 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
   <a href="#how-it-works" class="btn btn-primary focus-ring mt-8"><span data-i18n="solutionButton"></span><i data-lucide="arrow-down" width="18"></i></a>
  </section>

  <section id="how-it-works" class="section-shell py-14 sm:py-20">
   <span class="eyebrow"><i data-lucide="route" width="16"></i><span data-i18n="stepsEyebrow"></span></span>
   <h2 class="heading section-title mt-5" data-i18n="stepsTitle"></h2>
   <div id="steps-grid" class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
  </section>

  <section id="features" class="section-shell py-14 sm:py-20">
   <span class="eyebrow"><i data-lucide="layers-3" width="16"></i><span data-i18n="featuresEyebrow"></span></span>
   <h2 class="heading section-title mt-5" data-i18n="featuresTitle"></h2>
   <p class="section-copy" data-i18n="featuresCopy"></p>
   <div id="features-grid" class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
  </section>

  <section id="ai" class="section-shell py-14 sm:py-20">
   <div class="panel overflow-hidden p-5 sm:p-9">
    <span class="eyebrow"><i data-lucide="brain-circuit" width="16"></i><span data-i18n="aiEyebrow"></span></span>
    <h2 class="heading section-title mt-5" data-i18n="aiTitle"></h2>
    <p class="section-copy" data-i18n="aiCopy"></p>
    <div id="ai-grid" class="mt-9 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>
    <div class="mt-8 rounded-2xl border border-[#4c7cff] bg-[#18284d] p-5 text-[#dbe5ff]">
     <strong class="heading block text-lg" data-i18n="aiNoteTitle"></strong>
     <p class="mt-2 leading-8" data-i18n="aiNoteCopy"></p>
    </div>
   </div>
  </section>

  <section id="roles" class="section-shell py-14 sm:py-20">
   <span class="eyebrow"><i data-lucide="users" width="16"></i><span data-i18n="rolesEyebrow"></span></span>
   <h2 class="heading section-title mt-5" data-i18n="rolesTitle"></h2>
   <p class="section-copy" data-i18n="rolesCopy"></p>
   <div id="role-tabs" class="tab-row mt-9" role="tablist"></div>
   <div id="role-panel" class="panel mt-4 p-5 sm:p-8" role="tabpanel" tabindex="0"></div>
  </section>

  <section id="demo" class="section-shell py-14 sm:py-20">
   <div class="panel p-5 sm:p-9">
    <span class="eyebrow"><i data-lucide="flask-conical" width="16"></i><span data-i18n="demoEyebrow"></span></span>
    <h2 class="heading section-title mt-5" data-i18n="demoTitle"></h2>
    <p class="section-copy" data-i18n="demoCopy"></p>
    <div id="demo-controls" class="mt-8 grid gap-6 lg:grid-cols-3"></div>
    <button id="generate-plan" class="btn btn-primary focus-ring mt-8" type="button"><i data-lucide="sparkles" width="18"></i><span data-i18n="generate"></span></button>
    <div id="demo-state" class="mt-6" aria-live="polite"></div>
   </div>
  </section>

  <section class="section-shell py-14 sm:py-20">
   <div class="rounded-3xl border border-[#317854] bg-[linear-gradient(135deg,#103525,#111e30_62%,#18284d)] p-6 text-center sm:p-14">
    <span class="eyebrow"><i data-lucide="rocket" width="16"></i>SFNE</span>
    <h2 class="heading section-title mt-5" data-i18n="ctaTitle"></h2>
    <p class="mx-auto mt-4 max-w-2xl leading-8 text-[#b8c5d8]" data-i18n="ctaCopy"></p>
    <div class="mt-8 flex flex-wrap justify-center gap-3">
     <a href="/register" data-route="/register" class="btn btn-primary focus-ring route-link"></a>
     <a href="/contact" data-route="/contact" class="btn btn-outline focus-ring route-link"></a>
    </div>
   </div>
  </section>
 </main>

 <footer class="border-t border-[#26384f] bg-[#09111e]">
  <div class="section-shell grid gap-9 py-12 sm:grid-cols-2 lg:grid-cols-[1.4fr_1fr_1fr_1fr]">
   <div>
    <div class="flex items-center gap-2"><span class="grid h-10 w-10 place-items-center rounded-xl bg-[#57e3a0] font-black text-[#062419]">S</span><strong class="heading text-xl">SFNE</strong></div>
    <p class="mt-4 max-w-sm leading-8 text-[#93a4bd]" data-i18n="footerCopy"></p>
   </div>
   <div><h3 class="heading font-bold" data-i18n="footerPlatform"></h3><div id="footer-platform" class="mt-4 grid gap-3"></div></div>
   <div><h3 class="heading font-bold" data-i18n="footerAi"></h3><div id="footer-ai" class="mt-4 grid gap-3"></div></div>
   <div><h3 class="heading font-bold" data-i18n="footerCompany"></h3><div id="footer-company" class="mt-4 grid gap-3"></div></div>
  </div>
  <div class="section-shell flex flex-col items-center justify-between gap-3 border-t border-[#26384f] py-6 text-center text-sm text-[#93a4bd] md:flex-row md:text-start">
   <span data-i18n="copyright"></span><span data-i18n="graduation"></span><span data-i18n="footerMock"></span>
  </div>
 </footer>

 <button id="back-top" class="back-top focus-ring" type="button" aria-label="Top"><i data-lucide="arrow-up"></i></button>
 <div id="toast" class="toast fixed z-[60] flex items-center gap-3 rounded-xl border border-[#317854] bg-[#103525] px-4 py-3 text-sm font-bold text-[#d9ffe9] shadow-2xl" style="inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))" role="status">
  <i data-lucide="info" width="18"></i><span id="toast-text"></span>
 </div>
</div>

<script>
(() => {
  const dictionary = {
    ar: {
      nav:[["#problem","المشكلة"],["#solution","الحل"],["#features","المزايا"],["#ai","الذكاء الاصطناعي"],["#roles","الأدوار"],["#demo","تجربة"]],

  function startCounters() {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll("[data-count]").forEach(el=>{
      const final = +el.dataset.count;
      if(reduce){el.textContent=final;return}
      let current = 0;
      const timer = setInterval(()=>{
        current += Math.ceil(final/18);
        if(current >= final){current=final;clearInterval(timer)}
        el.textContent=current;
      },55);
    });
  }

  });

  $("#generate-plan").addEventListener("click",()=>{
    $("#demo-state").innerHTML=`<div class="rounded-2xl border border-[#4c7cff] bg-[#18284d] p-6 text-[#dbe5ff]"><div class="flex items-center gap-3"><div class="flex gap-1"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div><span>${t("loading")}</span></div></div>`;
    setTimeout(()=>{generateResult();icons()},1050);
  });

  $("#back-top").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

  const observer = new IntersectionObserver(entries=>{
    const current=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!current)return;
    document.querySelectorAll(".nav-link[href^='#']").forEach(l=>l.classList.toggle("active",l.getAttribute("href")==="#"+current.target.id));
  },{rootMargin:"-30% 0px -60% 0px",threshold:.05});
  ["problem","solution","features","ai","roles","demo"].forEach(id=>observer.observe(document.getElementById(id)));

  const heroObserver = new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting){startCounters();heroObserver.disconnect()}
  },{threshold:.15});
  heroObserver.observe($("#hero"));

  setText();
})();
</script>
</body>
</html>
